[tool.poetry]
name = "gym-pybullet-drones"
# Local version marker: this is the Canopy fork, not upstream. See FORK.md.
version = "2.2.0+canopy.1"
description = "PyBullet Gym environments for single and multi-agent reinforcement learning of quadcopter control"
authors = ["Jacopo Panerati <jacopo.panerati@utoronto.ca>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/learnsyslab/gym-pybullet-drones"
packages = [
    { include = "gym_pybullet_drones" }
]

[tool.poetry.dependencies]
# CANOPY PATCH: was "^3.12". PyBullet publishes no CPython wheel above 3.11, so
# upstream's floor would force a from-source Bullet build on every platform.
# All 27 library modules parse cleanly under the 3.11 grammar.
python = ">=3.11,<3.13"

# CANOPY PATCH: numpy was "^2.5" (which itself requires Python >= 3.12) and
# scipy was "^1.18" (same). Relaxed to the newest releases that support 3.11.
numpy = ">=2.4,<3"
scipy = ">=1.17,<2"

pybullet = ">=3.2.7,<4"
gymnasium = ">=1.3,<2"
transforms3d = ">=0.4,<0.5"
matplotlib = ">=3.9,<4"
pillow = ">=10"

# CANOPY PATCH: torch, stable-baselines3 and control were unconditional runtime
# dependencies. torch alone is ~2.5 GB installed and is imported only by
# examples/learn.py and examples/play.py; `control` only by
# control/MRACControl.py, which no package __init__ imports. They are extras now
# so the physics track stays lean.
torch = { version = ">=2.4", optional = true }
stable-baselines3 = { version = ">=2.9,<3", optional = true }
control = { version = ">=0.10.2", optional = true }

[tool.poetry.extras]
rl = ["torch", "stable-baselines3"]
mrac = ["control"]

# CANOPY PATCH: pytest was a runtime dependency; moved to a dev group so it is
# not installed transitively by consumers.
[tool.poetry.group.dev.dependencies]
pytest = ">=8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
