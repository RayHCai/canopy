# ---------------------------------------------------------------------------
# Canopy: one package, one dependency graph, one source of truth.
#
# Optional extras mirror the architecture's optional tracks (see spec.md
# "Key architecture decisions"): the critical path is kinematic + ray casting,
# so `rl` and `detect` are strictly additive and never required to run a
# mission.
# ---------------------------------------------------------------------------
[project]
name = "canopy"
version = "0.1.0"
description = "Autonomous drone swarm that maps a house, finds the meter, and produces a Site Survey Review packet."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ray Flanagan" }]
requires-python = ">=3.11,<3.12"

# Pinned to 3.11. The pin was forced by PyBullet's wheels, which are gone (see
# docs/adr/0006-kinematic-only-dynamics.md); it stands until someone has a
# reason to move. See docs/adr/0002-python-311-uv-and-pyenv.md.
dependencies = [
  "numpy>=2.4,<3",
  "scipy>=1.17,<2",
  "scikit-image>=0.26,<0.27",
  "shapely>=2.1,<3",
  "trimesh>=5.1,<6",
  "mapbox-earcut>=2.1,<3",
  "open3d>=0.20,<0.21",
  "rerun-sdk>=0.38,<0.39",
  "pyyaml>=6.0,<7",
  "jinja2>=3.1,<4",
  "matplotlib>=3.9,<4",
]

# The optional tracks are dependency groups (PEP 735), not extras. Canopy is an
# application, not a library: nobody installs `canopy[rl]` from an index,
# and groups are what uv can enable by default.
[dependency-groups]
dev = [
  "ruff>=0.15,<0.16",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pre-commit>=4,<5",
  "types-PyYAML>=6",
]

# Optional stretch tracks from the spec. Deliberately not default: torch alone is
# ~2.5 GB installed.
rl = ["stable-baselines3>=2.9,<3", "torch>=2.4"]
detect = ["ultralytics>=8.3"]

# Desktop viewer (`canopy-view`): a native window hosting a three.js scene.
# pywebview drives Edge WebView2 on Windows, WebKit on macOS, and GTK or Qt on
# Linux (the latter needs a system GUI toolkit). See docs/adr/0005.
viewer = ["pywebview>=6.2,<7"]

[tool.uv]
# `viewer` is small and pure Python, and `canopy-view` is the everyday way to
# watch the swarm.
default-groups = ["dev", "viewer"]

[project.scripts]
# Entry points live in the package, not in loose scripts, so they are
# importable, testable and type-checked like everything else.
canopy-fly = "canopy.cli.fly_single:main"
canopy-view = "canopy.cli.view:main"
canopy-site = "canopy.cli.site:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

# ---------------------------------------------------------------------------
# Ruff: lint + format. One tool, no black/isort/flake8 sprawl.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E", "W",  # pycodestyle
  "I",    # isort
  "N",    # pep8-naming
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations
  "S",    # flake8-bandit
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "ISC",  # implicit-str-concat
  "ICN",  # import-conventions
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "ARG",  # unused arguments
  "PTH",  # use pathlib
  "PL",   # pylint
  "NPY",  # numpy-specific
  "PERF", # perflint
  "FURB", # refurb
  "RUF",
]
ignore = [
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "ANN401",  # Any is occasionally the honest annotation
  "PLR0913", # sim/planner constructors legitimately take many tunables
  "ISC001",  # handled by the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use magic numbers, and skip docstrings on trivial cases.
"tests/**" = ["S101", "D100", "D103", "PLR2004", "ANN201", "ARG001"]
# Package markers document the module boundary; no runtime code to annotate.
"src/canopy/**/__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["canopy"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict over our own code, permissive at the third-party boundary.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/canopy", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

# trimesh ships no type information, so every mesh-construction call it exposes
# reads as "untyped" under strict mode; so do scikit-image's measure functions.
# Silencing that per call site would mean a `type: ignore` on every primitive
# worldgen builds; excluding the libraries keeps strictness where it belongs --
# on our own signatures -- and matches the permissive third-party boundary
# configured below.
untyped_calls_exclude = ["trimesh", "skimage"]

[[tool.mypy.overrides]]
# None of these ship (usable) type information.
module = [
  "open3d.*", "trimesh.*", "skimage.*", "shapely.*", "scipy.*",
  "matplotlib.*", "rerun.*", "webview.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--import-mode=importlib",
]
markers = [
  "slow: takes more than a couple of seconds",
  "network: talks to live public geodata services; skipped unless --run-network",
]
filterwarnings = [
  "error",
  "default::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/canopy"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  '@(abc\.)?abstractmethod',
]
